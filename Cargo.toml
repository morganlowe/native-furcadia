[package]
name = "furcadia-client"
version = "2.2.6"
edition = "2021"
description = "Native Linux & cross-platform Furcadia client core library, CLI, and GUI"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/morganlowe/native-furcadia"

[lib]
name = "furcadia_client"
path = "src/lib.rs"

[[bin]]
name = "furc-cli"
path = "src/bin/furc_cli.rs"

[[bin]]
name = "furc-gui"
path = "src/bin/furc_gui.rs"

[dependencies]
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
lzma-rs = "0.3"
bzip2-rs = "0.1"
openssl = "0.10"
openssl-sys = { version = "0.9", features = ["vendored"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", default-features = false, features = ["async-io"] }
winit = { version = "0.30", default-features = false, features = ["x11"] }
raw-window-handle = "0.6"
x11rb = { version = "0.13", default-features = false }
