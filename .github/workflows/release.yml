name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config
      - name: Run tests
        run: cargo test --all-targets
      - name: Build .deb package
        run: |
          chmod +x packaging/debian/build-deb.sh
          ./packaging/debian/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb

  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arch build tools
        run: |
          pacman -Syu --noconfirm base-devel rust cargo git libx11 libxcb libxkbcommon libglvnd curl bzip2 unzip openssl pkgconf
      - name: Build Arch package
        run: |
          useradd -m builder
          mkdir -p /tmp/archbuild/src
          cp -r "$GITHUB_WORKSPACE" "/tmp/archbuild/src/native-furcadia-${GITHUB_REF_NAME#v}"
          cp packaging/arch/PKGBUILD /tmp/archbuild/PKGBUILD
          chown -R builder:builder /tmp/archbuild
          su - builder -c 'cd /tmp/archbuild && PKGDEST=/tmp/archbuild makepkg -e --noconfirm'
          mkdir -p dist
          cp /tmp/archbuild/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst

  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM build dependencies
        run: |
          dnf install -y rpm-build rust cargo gcc gcc-c++ make perl-core pkgconf-pkg-config libxcb-devel libxkbcommon-devel libX11-devel mesa-libGL-devel
      - name: Build .rpm package
        run: |
          chmod +x packaging/rpm/build-rpm.sh
          ./packaging/rpm/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows binaries
        run: cargo build --release --locked --bins
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc packaging/windows/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/FurcadiaNative-Setup-*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-targets
      - name: Build macOS .dmg
        run: |
          chmod +x packaging/macos/build-dmg.sh
          ./packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  release:
    needs: [build-deb, build-arch, build-rpm, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          make_latest: true
          name: "Furcadia Native Client v2.2.6 — Whisper Tab Portraits"
          body: |
            ## Furcadia Native Client v2.2.6 — Whisper Tab Portraits

            A fast, standalone native Rust client for Furcadia supporting **Linux**, **Windows**, and **macOS** — no Wine or pre-existing Furcadia installation required.

            ### Highlights
            - Fast native GUI (`furc-gui`) built with `eframe` / `egui` and CLI (`furc-cli`)
            - Standalone first-launch setup: automatically downloads and caches stock modern & legacy `.fox` patches, species, dynamic Digo avatars, portraits, and dreams on demand
            - Modern (`V01.50`) and Legacy (`V01.40`) dream rendering, remappable custom portraits, desctags, inline smileys, and Windows Furcadia data import
            - Multi-character reorderable tabs, per-character cookie counts, Pounce friend watchlist, Saved Dreams, shared/per-device logs, and cloud folder sync (Nextcloud, Drive, Dropbox)
            - Native Linux desktop & system tray alert blinking (`StatusNotifierItem`), Windows installer, Fedora/RHEL/openSUSE RPM packages, and Apple Silicon macOS `.dmg` builds

            ### What's New in v2.2.6
            - **Whisper Tab-Tied Portraits**:
              - Clicking or focusing a whisper tab automatically opens that peer's portrait card in the sidebar (from cache, live dream avatar, saved portrait IDs, or a one-time silent `glook` without cluttering Main Chat or bumping Main Chat unread counts).
              - Switching between whisper tabs swaps to each peer's portrait, and returning to **Main Chat** restores the last clicked/looked-at player (or empty state if dismissed).
              - Re-clicking an active whisper tab snaps back to that peer's portrait if you temporarily looked at someone else on the map; explicit `Look` actions still update Main Chat's remembered player and display full descriptions.
              - Preserves per-tab and Main Chat portrait state across multi-character session switches.

            <details>
            <summary><strong>Previous Releases Recap (v2.2.5, v2.2.4, v2.2.3, v2.2.2, v2.2.1, v2.2.0, v2.1.x &amp; Milestone 2.0)</strong></summary>

            - **v2.2.5**: Leveled chat and whisper tab bar alignment across `Main Chat` and whisper tabs (`×` close buttons included) with unified regular/bold tab heights while preserving tight `2px` close-button spacing, `6px` inter-tab spacing, and drag-to-reorder.
            - **v2.2.4**: Added paired regular/bold system UI font discovery with SFNT validation and preserved fallbacks, integer `TextStyle` sizes, real bold weights for active/unread tabs and `<b>` chat spans, and dynamic tab/row heights.
            - **v2.2.3**: Added a multi-character close confirmation dialog before quitting with multiple character tabs open (`Close [name] Only`, `Close All ([names])`, or `Cancel`).

            - **v2.2.2**: Replaced egui's `.resizable(true)` `PanelState` feedback loop on **Pounce** and **Chat** with app-owned exact sizes and explicit 5px drag handles, preserved panel sizes across Windows minimize/restore, prevented `chat_scroll` from pushing the input row outside `chat_panel` at minimum height, and wrapped the Log Viewer character selector.
            - **v2.2.1**: Fixed left sidebar black vertical gap and right-edge clipping (`272px` base width, wrapped header/status/cookie rows, dynamic tab button widths, pinned looked-player card width), right-to-left row layouts in Pounce/Chat/detached whispers, and initial panel bounds.
            - **v2.2.0**: Automatic on-demand modern & legacy stock patch downloads/caching, legacy floor/path tile rendering fixes, Fedora/RHEL/openSUSE `.rpm` & Apple Silicon macOS `.dmg` packaging + updater support, and Arch/Debian packaging fixes.
            - **v2.1.2**: Character Picker custom portrait loading & fallback downloads, persistent `character_portraits` cache in `config.ini`, `last_port > 16` filtering, silent self-`glook`, and background-tab portrait directive handling.
            - **v2.1.1**: In-game translucent dream download overlay with progress bar/ETA/sidebar status and streaming `curl` timeout tuning for large multi-MB dreams.
            - **v2.1.0**: 13-bit LZW table-full `CLEAR` portrait decoding, classic 8-bit portrait palette remapping, persistent portrait mappings across dreams, clean in-game **Reconnect**, and smart chat scroll pinning.
            - **v2.0.0**: Bounded GPU/sprite caches, capped chat histories, clean tab thread/socket teardown, decompression bomb limits, atomic `0o600` config creation, and zero-warning Clippy baseline.

            </details>

            ### Download & Install

            #### Arch Linux / CachyOS / Manjaro / EndeavourOS
            Download `furcadia-native-2.2.6-1-x86_64.pkg.tar.zst` from the assets below and install with:
            ```sh
            sudo pacman -U ./furcadia-native-2.2.6-1-x86_64.pkg.tar.zst
            ```

            #### Debian / Ubuntu / Linux Mint
            Download `furcadia-native_2.2.6_amd64.deb` from the assets below and install with:
            ```sh
            sudo apt install ./furcadia-native_2.2.6_amd64.deb
            ```
            *(Or double-click the `.deb` file to open it in your graphical software installer.)*

            #### Fedora / RHEL / Rocky / AlmaLinux / openSUSE (RPM)
            Download `furcadia-native-2.2.6-1.*.x86_64.rpm` from the assets below and install with:
            ```sh
            # Fedora / RHEL / Rocky / AlmaLinux
            sudo dnf install ./furcadia-native-2.2.6-1*.x86_64.rpm

            # openSUSE
            sudo zypper install --allow-unsigned-rpm ./furcadia-native-2.2.6-1*.x86_64.rpm
            ```

            #### Windows (64-bit)
            1. Download `FurcadiaNative-Setup-2.2.6-x86_64.exe` from the assets below.
            2. Run the installer. It installs both `furc-gui` and `furc-cli`, creates a **Furcadia Native Client** Start Menu shortcut, and registers an uninstaller in **Apps & Features**.

            #### macOS (Apple Silicon)
            1. Download `FurcadiaNative-2.2.6-macos-arm64.dmg` from the assets below and open it.
            2. Drag **Furcadia Native Client** to **Applications** (the CLI binary `furc-cli` is also bundled inside `Contents/MacOS/`).
            3. Because the app is ad-hoc signed without an Apple Developer notarization certificate, clear the quarantine attribute before first launch if Gatekeeper blocks it:
               ```sh
               xattr -dr com.apple.quarantine "/Applications/Furcadia Native Client.app"
               ```

            ---

            ### Build from Source & Build Packages

            Install the [stable Rust toolchain](https://www.rust-lang.org/tools/install), then clone the repository:
            ```sh
            git clone https://github.com/${{ github.repository }}.git
            cd ${{ github.event.repository.name }}
            ```

            <details>
            <summary><strong>Build Instructions by Platform (Arch, Debian/Ubuntu, Fedora/RPM, Windows, macOS)</strong></summary>

            #### Arch Linux (`makepkg`)
            ```sh
            sudo pacman -S --needed base-devel rust git libx11 libxcb libxkbcommon libglvnd curl bzip2 unzip openssl pkgconf
            cd packaging/arch
            makepkg -si
            ```

            #### Debian / Ubuntu / Linux Mint (`.deb`)
            ```sh
            sudo apt-get update
            sudo apt-get install -y build-essential dpkg-dev pkg-config libssl-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev curl bzip2 unzip
            ./packaging/debian/build-deb.sh
            sudo apt install ./dist/furcadia-native_2.2.6_amd64.deb
            ```

            #### Fedora / RHEL / openSUSE (`.rpm`)
            ```sh
            sudo dnf install -y rpm-build gcc gcc-c++ make perl-core pkgconf-pkg-config libxcb-devel libxkbcommon-devel libX11-devel mesa-libGL-devel curl bzip2 unzip
            ./packaging/rpm/build-rpm.sh
            sudo dnf install ./dist/furcadia-native-2.2.6-1*.x86_64.rpm
            ```

            #### Windows (Inno Setup `.exe`)
            Requires Visual Studio Build Tools (MSVC C++ workload), Rust, and [Inno Setup 6](https://jrsoftware.org/isinfo.php):
            ```powershell
            cargo build --release --locked --bins
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
            # Output: dist\FurcadiaNative-Setup-2.2.6-x86_64.exe
            ```

            #### macOS (`.dmg`)
            Requires Xcode Command Line Tools (`xcode-select --install`) and Rust:
            ```sh
            ./packaging/macos/build-dmg.sh
            # Output: dist/FurcadiaNative-2.2.6-macos-$(uname -m).dmg
            ```

            #### Generic Binary Build (Any OS)
            ```sh
            cargo build --release --locked --bins
            # Outputs: target/release/furc-gui and target/release/furc-cli
            ```

            </details>
          files: |
            artifacts/debian-package/*.deb
            artifacts/arch-package/*.pkg.tar.zst
            artifacts/rpm-package/*.rpm
            artifacts/windows-installer/*.exe
            artifacts/macos-dmg/*.dmg
